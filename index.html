<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de desconto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="cartao">
        <h1>Calculadora de desconto</h1>
        <p class="regras">
            Compras acima de R$ 2.008 têm 10% de desconto.
            A partir de R$ 100, 5%. Abaixo disso, sem desconto.
        </p>

        <form onsubmit="calcular(); return false;">
            <label for="valorCompra">Valor total da compra (R$)</label>
            <input type="number" id="valorCompra" min="0" step="0.01" placeholder="0,00" required>
            <button type="submit">Calcular desconto</button>
        </form>

        <section id="resultado" class="resultado" hidden>
            <div class="linha">
                <span>Desconto</span>
                <strong id="resDesconto"></strong>
            </div>
            <div class="linha total">
                <span>Total a pagar</span>
                <strong id="resTotal"></strong>
            </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
